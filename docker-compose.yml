# Inventory Platform - local environment
#   docker compose up -d postgres            # database only (run the backend with Gradle)
#   docker compose --profile full up -d      # database + backend container
# Values come from .env (copy .env.example).
name: inventory-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-platform-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - inventory_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventory_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory-platform-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory_platform}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVER_PORT: 8082
      UPLOADS_DIR: /app/uploads
    ports:
      - "8082:8082"
    volumes:
      - inventory_platform_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  inventory_platform_pgdata:
  inventory_platform_uploads:
